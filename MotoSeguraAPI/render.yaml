services:
  - type: web
    name: motosegura-api
    env: docker
    region: ohio
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true

    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      - key: PORT
        value: 8080

      # 🔐 JWT
      - key: Jwt__Key
        value: supersecretkey12345678901234567890
      - key: Jwt__Issuer
        value: MotoSeguraAPI
      - key: Jwt__Audience
        value: MotoSeguraFrontend

      # 🗃 Cadena de conexión Neon
      - key: DefaultConnection
        sync: false
        value: Host=ep-xxx.us-east-1.aws.neon.tech;Port=5432;Database=neondb;Username=neondb_owner;Password=xxx;SSL Mode=Require
